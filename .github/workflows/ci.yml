name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulsewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pulsewatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulsewatch_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pulsewatch_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulsewatch_test?schema=public
      TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pulsewatch_test?schema=public
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-access-secret-that-is-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-characters-long
      MONITOR_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      FRONTEND_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and frontend tests
        run: pnpm test

      - name: Database integration tests
        run: pnpm test:api:integration

      - name: API end-to-end tests
        run: pnpm test:api:e2e

      - name: Production build
        run: pnpm build
